<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Calculator using HTML & CSS only</h1>
      <main>
        <input id="main-input" value="0" readonly />
        <div class="btns">
          <button class="op">C</button>
          <button class="op">&lt;x</button>
          <button class="op">%</button>
          <button class="op">/</button>
          <button>7</button>
          <button>8</button>
          <button>9</button>
          <button class="op">X</button>
          <button>4</button>
          <button>5</button>
          <button>6</button>
          <button class="op">-</button>
          <button>1</button>
          <button>2</button>
          <button>3</button>
          <button class="op">+</button>
          <button class="op">( )</button>
          <button>0</button>
          <button class="op">.</button>
          <button class="op">=</button>
        </div>
      </main>
    </div>
  </body>
</html>
