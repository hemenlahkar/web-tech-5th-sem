 <!-- Style a form input field with custom border, padding, and background color. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Registration Form</h2>
    <form onsubmit="((event)=>{event.preventDefault();})(event)">
        <div class="name">
            <label for="fname" id="fnameLabel">First Name:</label>
            <input type="text" id="fname" placeholder="John">
            <label for="lname" id="lnameLabel">Last Name:</label>
            <input type="text" id="lname" placeholder="Doe">
        </div>
        <div class="mail flex">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="john@example.com">
        </div>
        <div class="dob flex">
            <label for="dateOfBirth">Date of Birth:</label>
            <input type="date" id="dateOfBirth" min="1946-01-01" max="2008-12-31">
        </div>
        <div class="color flex">
            <label for="favColor">Favorite Color:</label>
            <input type="color" id="favColor">
        </div>
        <div class="submit">
            <input type="submit" value="Submit">
        </div>
    </form>
    </div>
</body>
</html>
