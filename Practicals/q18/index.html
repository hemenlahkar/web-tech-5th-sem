<!--  Implement a function that changes the innerText of a paragraph element 
to display a random number between 1 and 10 every time a button is clicked -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random number</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Generate a random number between 1 and 10(inclusive)</h1>
      <div class="btnContainer">
        <button id="genBtn">Generate</button>
      </div>
      <p id="para">Random number here...</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
