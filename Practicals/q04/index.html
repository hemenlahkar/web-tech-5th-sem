<!-- Create a table with multiple rows and columns to display tabular data -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        body {
            height: 100dvh;
            margin: 0;
            padding: 0;
            font-size: larger;
        }
        th, td {
            padding: 4px;
            border: 1px solid black;
        }
        table {
            border-collapse: collapse;
            margin-inline: auto;
            margin-block: 10rem;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th colspan="2">Name</th>
            <th>Roll no</th>
        </tr>
        <tr>
            <td>Hemen</td>
            <td>Lahkar</td>
            <td>0006</td>
        </tr>
        <tr>
            <td>John</td>
            <td>Doe</td>
            <td>0004</td>
        </tr>
        <tr>
            <td>Jane</td>
            <td>Williams</td>
            <td>0007</td>
        </tr>
    </table>
</body>
</html>
