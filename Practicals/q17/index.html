<!-- Create a button that, when clicked, appends a
 new paragraph element with a specific 
 text content to an existing div element. -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Append paragraph</title>
    <link rel="stylesheet" href="style.css">
 </head>
 <body>
    <main>
        <button>Append paragraph</button>
        <div id="paraContainer"></div>
    </main>

    <script src="script.js"></script>
 </body>
 </html>
