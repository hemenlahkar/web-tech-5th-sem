<!-- Embed a YouTube video on a webpage using the <iframe> tag -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Hemen Lahkar" />
    <title>YouTube</title>
    <style>
        main > div {
            display: flex;
            justify-content: center;
        }
    </style>
  </head>
  <body>
    <main>
        <h1>Here's a YouTube video embeded in this HTML document. Do like and share the video.</h1>
      <div>
        <iframe
          width="479"
          height="852"
          src="https://www.youtube.com/embed/WFyhdMbWdGU"
          title="নাচনী চেও | by Hemen Lahkar | বিহু ঢোল"
          frameborder="0"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          "
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </div>
    </main>
  </body>
</html>
