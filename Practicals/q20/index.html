<!-- Build a form with input fields for email, password
 and confirm password. When the form is submitted, use an
 alert to display a success message if the password and 
 confirm password values matches, otherwise show an error alert.
 Use JavaScript for the validation. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form with Validation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h2>Log In</h2>
        <form id="myForm">
            <div id="mailContainer">
                <label for="mail">Email:</label>
                <input type="email" name="email" id="mail">
            </div>
            <div id="passContainer">
                <label for="pass">Password</label>
                <input type="password" name="password" id="pass">
            </div>
            <div id="confPassContainer">
                <label for="confPass">Confirm Password</label>
                <input type="password" name="cpassword" id="confPass">
            </div>
            <button type="submit">Submit</button>
        </form>
    </main>


    <script src="script.js"></script>
</body>
</html>
