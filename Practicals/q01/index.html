<!-- Create a basic HTML webpage structure with a heading, paragraph, and an image. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic</title>
    <style>
        body {
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        main {
            padding: 2rem;
            border-radius: 6px;
            width: max(40vw, 500px);
            border: 1px dashed black;
        }
    </style>
</head>
<body>
    <main>
        <h1>Welcome</h1>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Adipisci officiis soluta perferendis illum dolores nemo at saepe, quae quia eum similique, minima pariatur porro et in officia dolorem. Quaerat similique adipisci ad fugit fuga.</p>
        <div><img src="image.jpg" alt="Starry Night" width="400"></div>
    </main>
</body>
</html>
